<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אורות הטירה | קבלני תשתיות ותאורה</title>
  <meta name="description" content="אורות הטירה - חברה לעבודות תשתית ותאורת כבישים.">
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" data-i18n="heroTitle"></a>
    <nav class="navlinks" aria-label="תפריט ראשי">
      <a class="navlink" href="#about" data-i18n="navAbout"></a>
      <a class="navlink" href="#services" data-i18n="navServices"></a>
      <a class="navlink" href="#gallery" data-i18n="navGallery"></a>
      <a class="navlink" href="#owner" data-i18n="navOwner"></a>
      <a class="navlink" href="#contact" data-i18n="navContact"></a>
    </nav>
    <button id="langToggle" class="lang-btn" aria-label="Switch language">EN</button>
  </header>

  <main>
    <section class="hero" id="top">
      <div class="hero-overlay">
        <h1 data-i18n="heroTitle">אורות הטירה</h1>
        <p data-i18n="heroSubtitle"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#gallery" data-i18n="heroBtnGallery"></a>
          <a class="btn btn-secondary" href="mailto:info@orot-hatira.co.il" data-i18n="heroBtnEmail"></a>
        </div>
      </div>
    </section>

    <section class="container custom-highlight" id="customHighlight">
      <h2 data-i18n="customTitle"></h2>
      <p data-i18n="customText"></p>
    </section>

    <section class="container about" id="about">
      <div class="section-head">
        <h2 data-i18n="aboutTitle"></h2>
        <p class="section-lead" data-i18n="aboutLead"></p>
      </div>

      <div class="two-col">
        <div>
          <h3 class="subhead" data-i18n="aboutWhatTitle"></h3>
          <p data-i18n="aboutWhatText"></p>

          <h3 class="subhead" data-i18n="aboutFocusTitle"></h3>
          <ul class="checklist">
            <li data-i18n="aboutPoint1"></li>
            <li data-i18n="aboutPoint2"></li>
            <li data-i18n="aboutPoint3"></li>
          </ul>
        </div>

        <div class="info-box">
          <h3 class="subhead" data-i18n="aboutDataTitle"></h3>
          <dl class="dl">
            <div>
              <dt data-i18n="dataCompany"></dt>
              <dd data-i18n="heroTitle"></dd>
            </div>
            <div>
              <dt data-i18n="dataField"></dt>
              <dd data-i18n="dataFieldValue"></dd>
            </div>
            <div>
              <dt data-i18n="dataFounder"></dt>
              <dd data-i18n="dataFounderValue"></dd>
            </div>
          </dl>

          <a class="source-link" target="_blank" rel="noopener noreferrer"
        href="https://www.dunsguide.co.il/Ce77c34bf47dc5841ef4279548e3ceb30_%D7%A7%D7%91%D7%9C%D7%A0%D7%99_%D7%A2%D7%91%D7%95%D7%93%D7%95%D7%AA_%D7%AA%D7%90%D7%95%D7%A8%D7%94/%D7%90%D7%95%D7%A8%D7%95%D7%AA_%D7%94%D7%98%D7%99%D7%A8%D7%94_%D7%91%D7%99%D7%A6%D7%95%D7%A2_1998/"
        data-i18n="sourceLink"></a>
        </div>
      </div>
    </section>

    <section class="container services" id="services">
      <h2 data-i18n="servicesTitle"></h2>
      <p class="section-lead" data-i18n="servicesLead"></p>
      <div class="card-grid" id="servicesCards"></div>
    </section>

    <section class="container gallery" id="gallery">
      <div class="section-head">
        <h2 data-i18n="galleryTitle"></h2>
        <p class="section-lead" data-i18n="galleryLead"></p>
      </div>

      <div class="carousel" id="galleryCarousel" aria-roledescription="carousel">
        <button class="carousel-btn prev" id="galleryPrev" type="button" aria-label="תמונה קודמת">‹</button>

        <div class="carousel-viewport" id="carouselViewport">
          <div class="carousel-track" id="carouselTrack"></div>
        </div>

        <button class="carousel-btn next" id="galleryNext" type="button" aria-label="תמונה הבאה">›</button>
      </div>
      <div class="carousel-dots" id="galleryDots" aria-label="ניווט לפי תמונה"></div>
    </section>

    <section class="container owner" id="owner">
      <div class="section-head">
        <h2 data-i18n="ownerTitle"></h2>
      </div>

      <div class="owner-grid">
        <div class="owner-photo" aria-hidden="true"></div>
        <div class="owner-info">
          <h3 class="subhead" data-i18n="ownerSubTitle"></h3>
          <p data-i18n="ownerText1"></p>

          <div class="owner-stats">
            <div class="stat">
              <span data-i18n="ownerNameLabel"></span>
              <strong data-i18n="ownerNameValue"></strong>
            </div>
            <div class="stat">
              <span data-i18n="ownerRoleLabel"></span>
              <strong data-i18n="ownerRoleValue"></strong>
            </div>
          </div>

          <p class="muted" data-i18n="ownerText2"></p>
        </div>
      </div>
    </section>

    <section class="container contact" id="contact">
      <h2 data-i18n="contactTitle"></h2>
      <p data-i18n="contactText"></p>
      <div class="contact-row">
        <a class="cta" href="mailto:info@orot-hatira.co.il" data-i18n="contactBtn"></a>
        <span class="contact-note" data-i18n="contactNote"></span>
      </div>
      <p><a class="source-link" href="admin.html">Admin</a></p>
    </section>
  </main>

  <div id="cookieBanner" class="cookie-banner hidden" role="dialog" aria-live="polite">
    <p data-i18n="cookieText"></p>
    <button id="acceptCookies" data-i18n="cookieBtn"></button>
  </div>

  <div id="miniPopup" class="popup hidden" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <div class="popup-card">
      <button id="closePopup" class="close-btn" aria-label="Close popup">×</button>
      <h3 id="popupTitle" data-i18n="popupTitle"></h3>
      <p data-i18n="popupText"></p>
      <form id="leadForm">
        <label for="emailInput" data-i18n="emailLabel"></label>
        <input id="emailInput" name="email" type="email" required placeholder="name@example.com">
        <button type="submit" data-i18n="popupBtn"></button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
